<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>US Airsoft World Battle Badges</title>
  <defs>
    <linearGradient id="edge" x2=".65" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f7e8bb"/><stop offset=".48" stop-color="#c1a87a"/><stop offset="1" stop-color="#dac69a"/>
    </linearGradient>
    <linearGradient id="cloth" x2="0" y2="1">
      <stop stop-color="#242925"/><stop offset=".63" stop-color="#0e1313"/><stop offset="1" stop-color="#20221e"/>
    </linearGradient>
    <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M-1 1l2-2M0 5l5-5M4 6l2-2" stroke="#fff" stroke-opacity=".065"/>
    </pattern>
    <path id="octagon" d="M52 9h152l43 43v152l-43 43H52L9 204V52Z"/>
    <g id="frame">
      <use xlink:href="#octagon" fill="url(#cloth)" stroke="#070909" stroke-width="14" stroke-linejoin="round"/>
      <use xlink:href="#octagon" fill="url(#weave)" stroke="url(#edge)" stroke-width="3" stroke-linejoin="round"/>
      <use xlink:href="#octagon" transform="translate(6 6) scale(.953125)" fill="none" stroke="#af9c77" stroke-opacity=".77" stroke-width="1.65" stroke-dasharray="4 2"/>
      <!-- Four block letters, shaped to follow the crown of the octagonal patch. -->
      <g fill="url(#edge)" stroke="#191611" stroke-width="1.5" stroke-linejoin="round">
        <path d="M42 49l12-3v29l5 3 5-5V43l12-2v35l-12 13-12 2-10-9Z"/>
        <path d="M81 45l6-7 27-4v10l-20 3v6l15-2 7 6v14l-6 8-28 4V72l20-3v-7l-14 2-7-5Z"/>
        <path fill-rule="evenodd" d="M119 76l12-43 16 1 14 43-13-1-2-8-14-1-2 8Zm16-18 8 1-4-15Z"/>
        <path d="M159 36l12 2 5 27 6-23 12 2 4 25 6-23 12 3-12 39-13-3-4-25-7 23-13-3Z"/>
      </g>
      <path d="M58 197h42m56 0h42" stroke="#867858" stroke-width="2"/>
      <path d="m128 189 2.6 5.3 5.9.8-4.3 4.2 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.2 5.9-.8Z" fill="#caba90"/>
    </g>
    <path id="shield" d="M86 96q42-6 84 0v43q-3 23-42 46-39-23-42-46Z"/>
    <g id="number">
      <use xlink:href="#shield" fill="#28332a" stroke="#ad9d79" stroke-width="3"/>
      <use xlink:href="#shield" fill="url(#weave)"/>
      <path d="m107 121 14-6 5-10h13v55l12 3v8h-47v-8l15-3v-34l-12 4Z" fill="currentColor" stroke="#e4d9b5" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="flag-shield">
      <use xlink:href="#shield" fill="#3a3a32" stroke="url(#edge)" stroke-width="4"/>
      <path d="M99 108h58v34H99Z" fill="#d4c29a"/>
      <path d="M99 110h58m-58 6h58m-58 6h58m-58 6h58m-58 6h58m-58 6h58" stroke="#48463a" stroke-width="3"/>
      <path d="M99 108h24v19H99Z" fill="#292c29"/>
      <path d="M103 112h15m-15 5h15m-15 5h15" stroke="#e1d0a4" stroke-width="2.4" stroke-dasharray="2 3"/>
      <path d="m112 154 16 11 16-11m-28 7 12 8 12-8" fill="none" stroke="#d7c8a6" stroke-width="3"/>
    </g>
    <path id="star" d="m128 99 12 27 29 3-22 20 6 29-25-15-25 15 6-29-22-20 29-3Z"/>
    <g id="star-facets">
      <path d="m128 99 0 44 12-17Zm41 30-41 14 19 6Zm-16 49-25-35v20Zm-50 0 25-35-19 6Zm-16-49 41 14-12-17Z" fill="white" opacity=".2"/>
    </g>
  </defs>
  <view id="red" viewBox="0 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(0 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#number" color="#c9433c"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="91" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">RED MVP</text>
  </g>
  <view id="orange" viewBox="1024 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(1024 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#number" color="#f49b50"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="130" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">ORANGE MVP</text>
  </g>
  <view id="black" viewBox="2048 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(2048 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#number" color="#101211"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="117" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">BLACK MVP</text>
  </g>
  <view id="yellow" viewBox="3072 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(3072 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#number" color="#f6d850"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="130" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">YELLOW MVP</text>
  </g>
  <view id="blue" viewBox="4096 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(4096 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#number" color="#377dcc"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="104" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">BLUE MVP</text>
  </g>
  <view id="green" viewBox="5120 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(5120 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#number" color="#429466"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="117" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">GREEN MVP</text>
  </g>
  <view id="gray" viewBox="6144 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(6144 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#number" color="#93958d"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="104" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">GRAY MVP</text>
  </g>
  <view id="gold-thread" viewBox="7168 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(7168 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#number" color="#cf9f35"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="104" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">GOLD MVP</text>
  </g>
  <view id="tower-of-power" viewBox="8192 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(8192 0)">
    <use xlink:href="#frame"/>
    <use xlink:href="#flag-shield"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="162" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">TOWER OF POWER</text>
  </g>
  <view id="silver-star" viewBox="9216 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(9216 0)">
    <use xlink:href="#frame"/>
    <path d="m128 92 47 26v38l-47 31-47-31v-38Z" fill="#9fa5a6" stroke="#d4d9db" stroke-width="3"/><use xlink:href="#star" fill="#242b2f" stroke="#d4d9db" stroke-width="1.5"/><use xlink:href="#star-facets"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="143" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">SILVER STAR</text>
  </g>
  <view id="gold-star" viewBox="10240 0 256 256" preserveAspectRatio="xMidYMid meet"/>
  <g transform="translate(10240 0)">
    <use xlink:href="#frame"/>
    <path d="m128 92 47 26v38l-47 31-47-31v-38Z" fill="#181c1d" stroke="#f5d470" stroke-width="3"/><use xlink:href="#star" fill="#dbad38" stroke="#f5d470" stroke-width="1.5"/><use xlink:href="#star-facets"/>
    <text x="128" y="228" text-anchor="middle" font-family="Impact, 'Arial Narrow', sans-serif" font-size="20" font-weight="900" textLength="117" lengthAdjust="spacingAndGlyphs" fill="#e6d8b7">GOLD STAR</text>
  </g>
</svg>
